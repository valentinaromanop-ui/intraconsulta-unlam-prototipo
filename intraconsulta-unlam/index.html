<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Intraconsulta UNLaM</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Barra superior según wireframe -->
  <header class="top-header">
    <div class="header-left">
      <strong>UNLaM | Intraconsulta</strong>
    </div>
    <div class="header-right">
      <a href="ayuda.html" class="icon-btn" title="Calendario y Ayuda">📅</a>
      <span class="icon-btn" title="Usuario">👤</span>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <h1>INICIAR SESIÓN</h1>
      <p class="subtitle">Sistema de Autogestión de Alumnos - UNLaM</p>

      <form action="home.html">
        <input type="text" class="pill-input" placeholder="DNI o Usuario Institucional" required>
        <input type="password" class="pill-input" placeholder="Contraseña" required>
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 8px;">Ingresar al Portal</button>
      </form>

      <div class="auth-links">
        <a href="registro.html">¿No tenés cuenta? Registrate acá</a>
        <a href="error.html">¿Olvidaste tu contraseña? Recuperar acceso</a>
      </div>
    </div>
  </main>

  <footer class="main-footer">
    Universidad Nacional de La Matanza • Florencio Varela 1903, San Justo • Soporte Técnico
  </footer>

</body>
</html>
