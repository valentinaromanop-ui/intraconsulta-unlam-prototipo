<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Intraconsulta UNLaM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login" data-layout="auth">
<main class="auth-wrapper">
  <div class="auth-card">
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Sistema de autogestión de alumnos UNLaM</p>
    <form data-demo="Ingresando a Intraconsulta..." data-redirect="home.html">
      <div class="form-group"><label for="u">Usuario o DNI</label><input class="form-control" id="u" required autocomplete="username" inputmode="numeric"></div>
      <div class="form-group"><label for="p">Contraseña</label><input class="form-control" id="p" type="password" required autocomplete="current-password"></div>
      <button class="btn-primary" type="submit">Ingresar</button>
    </form>
    <div class="auth-links"><a href="error.html?q=recuperar">¿Olvidaste tu contraseña?</a><a href="registro.html">¿Sos alumno nuevo? Registrate</a></div>
  </div>
</main>
  <script src="js/app.js"></script>
</body>
</html>
