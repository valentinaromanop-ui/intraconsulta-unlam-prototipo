<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Intraconsulta UNLaM</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="top-header">
    <div class="header-left">
      <a href="index.html" class="icon-btn" title="Volver">🏠</a>
      <strong>UNLaM | Registro de Alumno</strong>
    </div>
    <div class="header-right">
      <span class="icon-btn">📅</span>
      <span class="icon-btn">👤</span>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <h1>REGISTRO</h1>
      <p class="subtitle">Completá tus datos para activar tu autogestión</p>

      <form action="home.html">
        <input type="text" class="pill-input" placeholder="Nombre y Apellido" required>
        <input type="number" class="pill-input" placeholder="Número de DNI" required>
        <input type="email" class="pill-input" placeholder="Correo electrónico institucional o personal" required>
        <input type="password" class="pill-input" placeholder="Crear contraseña" required>
        <input type="password" class="pill-input" placeholder="Repetir contraseña" required>
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 8px;">Crear Cuenta</button>
      </form>

      <div class="auth-links">
        <a href="index.html">Ya tengo usuario • Volver a Iniciar Sesión</a>
      </div>
    </div>
  </main>

  <footer class="main-footer">
    Universidad Nacional de La Matanza • Florencio Varela 1903, San Justo • Soporte Técnico
  </footer>

</body>
</html>
