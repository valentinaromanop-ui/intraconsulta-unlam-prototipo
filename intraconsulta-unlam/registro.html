<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Intraconsulta UNLaM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="registro" data-layout="auth">
<main class="auth-wrapper">
  <div class="auth-card">
    <h1>Crear cuenta</h1>
    <p class="subtitle">Completá tus datos para activar tu usuario</p>
    <form data-demo="Cuenta creada. Ya podés iniciar sesión." data-redirect="index.html">
      <div class="form-group"><label for="n">Nombre y apellido</label><input class="form-control" id="n" required autocomplete="name"></div>
      <div class="form-group"><label for="d">DNI</label><input class="form-control" id="d" required inputmode="numeric" pattern="[0-9]{7,8}" title="Ingresá 7 u 8 números"></div>
      <div class="form-group"><label for="e">Correo electrónico</label><input class="form-control" id="e" type="email" required autocomplete="email"></div>
      <div class="form-group"><label for="c">Contraseña</label><input class="form-control" id="c" type="password" minlength="8" required autocomplete="new-password"><p class="hint">Mínimo 8 caracteres.</p></div>
      <button class="btn-primary" type="submit">Registrarme</button>
    </form>
    <div class="auth-links"><a href="index.html">¿Ya tenés cuenta? Iniciá sesión</a></div>
  </div>
</main>
  <script src="js/app.js"></script>
</body>
</html>
