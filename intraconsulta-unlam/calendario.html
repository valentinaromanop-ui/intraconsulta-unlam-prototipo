<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario - Intraconsulta UNLaM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="calendario" data-layout="app">
<main class="main-content">
  <h1 class="page-title">Calendario académico</h1>
  <p class="page-sub">Fechas clave de UNLaM, feriados y tus recordatorios.</p>
  <div class="cal-layout">
    <section class="card">
      <div class="cal-nav"><button class="btn-outline btn-sm" id="calPrev" aria-label="Mes anterior">&#8249;</button><h2 id="calTitle"></h2><button class="btn-outline btn-sm" id="calNext" aria-label="Mes siguiente">&#8250;</button></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend"><span><i class="legend-dot" style="background:#16A34A"></i>UNLaM</span><span><i class="legend-dot" style="background:#DC2626"></i>Feriado</span><span><i class="legend-dot" style="background:#2563EB"></i>Personal</span></div>
    </section>
    <aside>
      <div class="card"><div class="card-header"><h2>Detalle del día</h2><button class="btn-outline btn-sm" id="calToday">Hoy</button></div><div id="dayDetail"></div></div>
      <form class="card" id="evForm"><div class="card-header"><h2>Agregar recordatorio</h2></div>
        <div class="form-group"><label for="evDate">Fecha</label><input class="form-control" id="evDate" type="date" required></div>
        <div class="form-group"><label for="evText">Descripción</label><input class="form-control" id="evText" maxlength="40" required></div>
        <button class="btn-primary" type="submit">Agregar</button></form>
    </aside>
  </div>
</main>
  <script src="js/app.js"></script>
</body>
</html>
