<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil - Intraconsulta UNLaM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="perfil" data-layout="app">
<main class="main-content">
  <h1 class="page-title">Mi perfil</h1>
  <p class="page-sub">Consultá tus datos personales y mantené actualizada tu información de contacto.</p>
  <div class="grid-2">
    <section class="card">
      <div class="profile-heading">
        <div class="profile-avatar" data-profile-initials aria-hidden="true"></div>
        <div>
          <h2 data-profile-name></h2>
          <p class="profile-career" data-profile-career></p>
          <span class="status-badge status-ok">Alumno regular</span>
        </div>
      </div>
      <div class="card-header"><h2>Datos académicos</h2></div>
      <dl class="profile-details">
        <div><dt>Legajo</dt><dd data-profile-legajo></dd></div>
        <div><dt>DNI</dt><dd data-profile-dni></dd></div>
        <div><dt>Carrera</dt><dd data-profile-career></dd></div>
      </dl>
    </section>
    <form class="card" id="profileForm">
      <div class="card-header"><h2>Datos de contacto</h2></div>
      <div class="form-group">
        <label for="profileEmail">Correo electrónico</label>
        <input class="form-control" id="profileEmail" type="email" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="profilePhone">Teléfono</label>
        <input class="form-control" id="profilePhone" type="tel" autocomplete="tel" required>
      </div>
      <div class="form-group">
        <label for="profileAddress">Domicilio</label>
        <input class="form-control" id="profileAddress" autocomplete="street-address" required>
      </div>
      <p class="hint">Estos datos se guardan en este dispositivo.</p>
      <button class="btn-primary" type="submit">Guardar cambios</button>
    </form>
  </div>
</main>
  <script src="js/app.js"></script>
</body>
</html>
